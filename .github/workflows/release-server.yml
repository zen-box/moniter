name: Release Server

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python scripts/release.py validate server "$RELEASE_TAG"
          python scripts/test-release.py
          bash -n install.sh
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - name: Build React frontend
        working-directory: web/app
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend
          path: web/dist/
          if-no-files-found: error

  agents:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Download previously released Agent binaries (no compilation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py fetch-agents
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bundled-agents
          path: release-output/agents/
          if-no-files-found: error

  build:
    needs: [frontend, agents]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: windows-amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      MONITER_UPDATE_CHECK: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: frontend
          path: web/dist
      - uses: actions/download-artifact@v8.0.2
        with:
          name: bundled-agents
          path: release-output/agents
      - name: Install Rust target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add '${{ matrix.target }}'
      - name: Test Linux installer lifecycle
        if: runner.os == 'Linux'
        run: python scripts/test-install-linux.py
      - name: Install native musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-C linker=musl-gcc' >> "$GITHUB_ENV"
      - name: Test and build server only
        run: |
          cargo test --locked -p aegis-server --target '${{ matrix.target }}'
          cargo build --release --locked -p aegis-server --target '${{ matrix.target }}'
      - name: Test Windows installer with the built release binary
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-install-windows.ps1 -ServerBinary target/${{ matrix.target }}/release/aegis-server.exe
      - name: Package server with UI and released Agents
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          suffix=''
          if [[ "$PLATFORM" == windows-* ]]; then suffix='.exe'; fi
          python scripts/release.py package server "$RELEASE_TAG" "$PLATFORM" --binary "target/$TARGET/release/aegis-server$suffix"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: server-${{ matrix.platform }}
          path: release-output/moniter-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: server-*
          merge-multiple: true
          path: release-output
      - name: Publish server release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-output/* --verify-tag --title "Moniter ${RELEASE_TAG#v}" --generate-notes --latest
