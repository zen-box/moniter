name: Release Agent

on:
  push:
    tags: ['agent-v*']

permissions:
  contents: read

concurrency:
  group: release-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: windows-amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Validate Agent version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/agent
          python scripts/release.py validate agent "$RELEASE_TAG"
          python scripts/test-release.py
      - name: Install Rust target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add '${{ matrix.target }}'
      - name: Install native musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-C linker=musl-gcc' >> "$GITHUB_ENV"
      - name: Test and build Agent only
        run: |
          cargo test --locked -p aegis-agent --target '${{ matrix.target }}'
          cargo build --release --locked -p aegis-agent --target '${{ matrix.target }}'
      - name: Verify TLS initialization in the built Agent
        env:
          TARGET: ${{ matrix.target }}
        run: |
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          python scripts/test-agent-tls.py "target/$TARGET/release/aegis-agent$suffix"
      - name: Package Agent
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          suffix=''
          if [[ "$PLATFORM" == windows-* ]]; then suffix='.exe'; fi
          python scripts/release.py package agent "$RELEASE_TAG" "$PLATFORM" --binary "target/$TARGET/release/aegis-agent$suffix"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: agent-${{ matrix.platform }}
          path: release-output/moniter-agent-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: agent-*
          merge-multiple: true
          path: release-output
      - name: Publish independent Agent release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-output/* --verify-tag --title "Moniter Agent ${RELEASE_TAG#agent-v}" --generate-notes --latest=false
