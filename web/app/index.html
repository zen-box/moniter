<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="site-name" content="__SITE_NAME__" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='10' fill='%2327272a'/%3E%3Cg fill='none' stroke='white' stroke-width='1.7'%3E%3Crect x='9' y='8' width='18' height='8' rx='2'/%3E%3Crect x='9' y='20' width='18' height='8' rx='2'/%3E%3Cpath d='M12 12h2m-2 12h2'/%3E%3C/g%3E%3C/svg%3E" />
    <title>__SITE_NAME__</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      html { background: #f5f6f8; color-scheme: light; }
      html[data-theme="dark"] { background: #10151d; color-scheme: dark; }
      .boot-shell { min-height: 100vh; display: grid; place-items: center; background: #f5f6f8; }
      html[data-theme="dark"] .boot-shell { background: #10151d; }
      .boot-mark { width: 30px; height: 30px; border: 3px solid #dbe9fb; border-top-color: #147df5; border-radius: 50%; animation: moniter-boot 0.8s linear infinite; }
      @keyframes moniter-boot { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-mark { animation-duration: 1.6s; } }
    </style>
    <script>
      (function () {
        var saved = localStorage.getItem('aegis_theme') || 'system';
        var dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <script>window.__MONITER_BOOTSTRAP__ = __INITIAL_SERVERS__;</script>
  </head>
  <body>
    <div id="root"><div class="boot-shell"><div class="boot-mark"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
