[package]
name = "aegis-server"
version = "0.1.1"
edition = "2021"
description = "Modern Server Probe Master Server with Theme Engine and SQLite"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.5", features = ["fs", "cors", "compression-gzip"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
argon2 = "0.5"
# gen_secret 用于生成密钥，otpauth 用于导出 otpauth:// 二维码地址
totp-rs = { version = "5.6", features = ["gen_secret", "otpauth"] }
rand = "0.8"
sha2 = "0.10"
ipnet = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 告警邮件：纯 Rust 实现，不依赖系统 OpenSSL
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "rustls-tls"] }
# 2FA 绑定二维码（服务端直接出 SVG，不依赖外部 CDN）
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
